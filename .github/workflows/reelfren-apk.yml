name: Build Android APKs (ReelFren + ShortMax + DramaFren)

on:
  push:
    paths:
      - 'ReelFren/**'
      - '.github/workflows/reelfren-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

# build-urile ruleaza pe rand (ca la prima rulare sa nu se creeze doua chei de semnare diferite)
concurrency:
  group: reelfren-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReelFren
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle: copie pastrata in cache; serverul services.gradle.org da uneori "504 Gateway Time-out"
      - name: Restore Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-8.7

      - name: Install Gradle 8.7
        working-directory: .
        run: |
          D="$HOME/gradle-dist"
          if [ ! -x "$D/gradle-8.7/bin/gradle" ]; then
            mkdir -p "$D"
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              for u in https://services.gradle.org/distributions/gradle-8.7-bin.zip \
                       https://downloads.gradle.org/distributions/gradle-8.7-bin.zip \
                       https://github.com/gradle/gradle-distributions/releases/download/v8.7.0/gradle-8.7-bin.zip; do
                if curl -fsSL --retry 2 -o "$D/g.zip" "$u"; then ok=1; break 2; fi
              done
              echo "Gradle download failed (attempt $i), retrying..."; sleep $((i*10))
            done
            [ "$ok" = 1 ] || { echo "::error::Nu am putut descarca Gradle"; exit 1; }
            unzip -q "$D/g.zip" -d "$D" && rm "$D/g.zip"
          fi
          echo "$D/gradle-8.7/bin" >> "$GITHUB_PATH"

      # Aceeasi cheie de semnare la fiecare build (pastrata in cache-ul GitHub Actions), ca versiunile noi
      # sa se instaleze peste cele vechi fara dezinstalare (si fara sa se piarda datele din aplicatie).
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.reelfren-signing
          key: reelfren-signing-v1

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REELFREN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REELFREN_KEYSTORE_PASSWORD }}
        run: |
          KDIR="$HOME/.reelfren-signing"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            mkdir -p "$KDIR"
            if [ ! -f "$KDIR/release.keystore" ]; then
              echo "::warning::Cheie de semnare noua (prima data sau cache expirat). Doar acest update cere dezinstalarea versiunii vechi."
              openssl rand -hex 16 > "$KDIR/pass"
              PASS=$(cat "$KDIR/pass")
              keytool -genkeypair -keystore "$KDIR/release.keystore" -storepass "$PASS" -keypass "$PASS" \
                -alias reelfren -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ReelFren Personal"
            fi
            PASS=$(cat "$KDIR/pass")
            echo "::add-mask::$PASS"
            echo "KEYSTORE_FILE=$KDIR/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: gradle --no-daemon assembleReelfrenRelease assembleShortmaxRelease assembleDramafrenRelease

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/reelfren/release/app-reelfren-release.apk ReelFren.apk
          cp app/build/outputs/apk/shortmax/release/app-shortmax-release.apk ShortMax.apk
          cp app/build/outputs/apk/dramafren/release/app-dramafren-release.apk DramaFren.apk

      # Copie a APK-urilor in depozit (folderul apk/): se descarca de pe raw.githubusercontent.com, un alt
      # server decat cel al versiunilor (care uneori da "504 Gateway Time-out"). Link fix = mereu ultima versiune.
      - name: Publish APK copies (fixed raw link)
        run: |
          mkdir -p ../apk
          cp ReelFren.apk ShortMax.apk DramaFren.apk ../apk/
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/ReelFren.apk apk/ShortMax.apk apk/DramaFren.apk
          git commit -m "Update APKs (build ${{ github.run_number }}) [skip ci]" || exit 0
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && break
            git fetch --depth=20 origin ${{ github.ref_name }} && git rebase FETCH_HEAD || true
            sleep 3
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ReelFren/ReelFren.apk
            ReelFren/ShortMax.apk
            ReelFren/DramaFren.apk

      - name: Publish release (download direct de pe telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reelfren-v${{ github.run_number }}
          name: ReelFren v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ReelFren/ReelFren.apk

      - name: Publish ShortMax release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shortmax-v${{ github.run_number }}
          name: ShortMax Android v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ReelFren/ShortMax.apk

      - name: Publish DramaFren release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dramafren-v${{ github.run_number }}
          name: DramaFren Android v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ReelFren/DramaFren.apk
