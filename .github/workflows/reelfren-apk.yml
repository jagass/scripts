name: Build ReelFren APK

on:
  push:
    paths:
      - 'ReelFren/**'
      - '.github/workflows/reelfren-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ReelFren
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.REELFREN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REELFREN_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Secrets REELFREN_KEYSTORE_* lipsesc - folosesc o cheie temporara. Update-urile vor cere dezinstalarea versiunii vechi."
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$PASS" -keypass "$PASS" \
              -alias reelfren -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ReelFren Personal"
            echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ReelFren.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReelFren-apk
          path: ReelFren/ReelFren.apk

      - name: Publish release (download direct de pe telefon)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reelfren-v${{ github.run_number }}
          name: ReelFren v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ReelFren/ReelFren.apk
