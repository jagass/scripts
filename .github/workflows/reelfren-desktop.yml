name: Build ReelFren Desktop (Windows)

on:
  push:
    paths:
      - 'ReelFren-desktop/**'
      - 'ReelFren/app/src/main/assets/**'
      - '.github/workflows/reelfren-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ReelFren-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: ReelFren-exe
          path: ReelFren-desktop/dist/ReelFren.exe

      - name: Publish release (download direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: reelfren-desktop-v${{ github.run_number }}
          name: ReelFren Desktop v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ReelFren-desktop/dist/ReelFren.exe
