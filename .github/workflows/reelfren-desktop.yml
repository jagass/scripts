name: Build Desktop Apps (Windows)

on:
  push:
    paths:
      - 'ReelFren-desktop/**'
      - 'ReelFren/app/src/main/assets/**'
      - '.github/workflows/reelfren-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: reelfren
            exe: ReelFren.exe
            title: ReelFren Desktop
          - site: shortmax
            exe: ShortMax.exe
            title: ShortMax Desktop
          - site: dramafren
            exe: DramaFren.exe
            title: DramaFren Desktop
    defaults:
      run:
        working-directory: ReelFren-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build portable exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node build-site.js ${{ matrix.site }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.site }}-exe
          path: ReelFren-desktop/dist/${{ matrix.exe }}

      - name: Publish release (download direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.site }}-desktop-v${{ github.run_number }}
          name: ${{ matrix.title }} v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ReelFren-desktop/dist/${{ matrix.exe }}
