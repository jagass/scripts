<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DramaFren</title>
<style>
  :root { --bg:#101014; --card:#1b1b22; --line:#2a2a33; --tx:#eee; --mut:#9a9aa8; --acc:#e94b6a; --ok:#3fb27f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.35 system-ui, -apple-system, Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(16,16,20,.97); border-bottom:1px solid var(--line); padding:8px 10px 6px; }
  .row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .row + .row { margin-top:6px; }
  h1 { font-size:17px; margin:0 6px 0 0; color:var(--acc); }
  button, select, input { font:inherit; color:var(--tx); background:#24242d; border:1px solid var(--line); border-radius:9px; padding:7px 10px; }
  button:active { background:#33333f; }
  button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.go { background:#2b6cdf; border-color:#2b6cdf; color:#fff; }
  #q { flex:1; min-width:140px; }
  #minep { width:64px; }
  #status { color:var(--mut); font-size:12px; margin-top:6px; min-height:16px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(112px, 1fr)); gap:10px; padding:10px; }
  .c { position:relative; background:var(--card); border-radius:10px; overflow:hidden; }
  .c img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#222; }
  .c .t { padding:5px 6px 2px; font-size:12.5px; line-height:1.25; height:3.6em; overflow:hidden; }
  .c .m { display:flex; justify-content:space-between; align-items:center; padding:0 6px 6px; font-size:11px; color:var(--mut); gap:4px; }
  .ep { position:absolute; top:5px; left:5px; background:rgba(0,0,0,.75); color:#fff; font-size:11px; font-weight:600; padding:2px 6px; border-radius:6px; }
  .nw { position:absolute; top:5px; right:5px; background:var(--ok); color:#fff; font-size:10px; font-weight:700; padding:2px 5px; border-radius:6px; }
  .al { color:#ffcf5a; }
  /* butoanele De vazut / Vazut: mari, peste poster, mereu vizibile */
  .pw { position:relative; }
  .mk { position:absolute; right:5px; bottom:5px; display:flex; gap:6px; z-index:2; }
  .mk button { width:36px; height:36px; padding:0; border-radius:50%; font-size:17px; line-height:1;
    background:rgba(0,0,0,.72); border:2px solid rgba(255,255,255,.85); box-shadow:0 1px 6px rgba(0,0,0,.6); }
  .mk button.on { background:var(--acc); border-color:#fff; }
  #gen { flex:1; min-width:140px; }
  #genX { padding:7px 11px; }
  .gl { display:none; margin-top:6px; max-height:52vh; overflow:auto; background:#17171d; border:1px solid var(--line); border-radius:10px; }
  .gl.show { display:block; }
  .gl .gi { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; background:none; padding:9px 12px; }
  .gl .gi:last-child { border-bottom:0; }
  .gl .gi small { display:block; color:var(--mut); font-size:11.5px; margin-top:2px; }
  .gl .gh { padding:8px 12px; color:var(--mut); font-size:12px; }
  #more { display:block; margin:6px auto 24px; }
  .empty { padding:30px 20px; color:var(--mut); text-align:center; line-height:1.6; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10; display:none; align-items:flex-end; }
  .sheet.show { display:flex; }
  .sheet > div { background:#17171d; width:100%; max-height:80vh; overflow:auto; border-radius:14px 14px 0 0; padding:14px; }
  .sheet h3 { margin:0 0 10px; font-size:16px; }
  .li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .li .x { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .li small { color:var(--mut); display:block; }
  .st-ok { color:var(--ok); } .st-cf { color:#ffcf5a; } .st-gol { color:#e66; }
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>DramaFren</h1>
    <button id="crawl" class="go">🔄 Caută filme</button>
    <button id="sitesBtn">🌐 Site-uri</button>
    <button id="menuBtn">⋯</button>
  </div>
  <div class="row">
    <input id="q" type="search" placeholder="Caută în lista mea…" autocomplete="off">
    <button id="siteSearch" title="Caută titlul pe toate site-urile">🌐 Caută pe site-uri</button>
    <select id="sort">
      <option value="ep">Episoade ↓</option>
      <option value="new">Noi primele</option>
      <option value="ti">Titlu A-Z</option>
    </select>
  </div>
  <div class="row">
    <input id="gen" type="search" placeholder="🎭 Gen: CEO, răzbunare, 18+…" autocomplete="off">
    <button id="genX" style="display:none" aria-label="Șterge genul">✕</button>
  </div>
  <div id="genList" class="gl"></div>
  <div class="row">
    <button id="vAll" class="on">Toate</button>
    <button id="vWatch">📌 De văzut</button>
    <button id="vSeen">👁 Văzute</button>
    <input id="minep" type="number" min="0" placeholder="min EP" inputmode="numeric">
    <select id="site"><option value="">Toate site-urile</option></select>
  </div>
  <div id="status"></div>
</header>
<div id="grid"></div>
<button id="more" style="display:none">Arată mai multe</button>
<div id="empty" class="empty" style="display:none"></div>

<div id="sheet" class="sheet"><div id="sheetBody"></div></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var groups = [], sites = [], totalItems = 0, crawling = false;
  var view = 'all', shown = 0, filtered = [], PAGE = 90;
  var lastVisit = +(lsGet('df.lastVisit') || 0), visitStart = Date.now();

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function loadSet(k) { try { return JSON.parse(lsGet(k) || '{}') || {}; } catch (e) { return {}; } }
  var watch = loadSet('df.watch'), seen = loadSet('df.seen');
  function marked(set, g) { for (var i = 0; i < g.ks.length; i++) if (set[g.ks[i]]) return true; return false; }
  function toggleMark(set, name, g) {
    if (marked(set, g)) g.ks.forEach(function (k) { delete set[k]; });
    else g.ks.forEach(function (k) { set[k] = 1; });
    lsSet(name, JSON.stringify(set));
  }

  // mesaje scurte (pe desktop; pe telefon le arata Android)
  var toastEl = null, toastT = null;
  function toast(t) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.85);color:#fff;padding:10px 16px;border-radius:12px;max-width:90vw;font-size:14px;transition:opacity .3s';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = t; toastEl.style.opacity = '1';
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.style.opacity = '0'; }, 3500);
  }
  function send(m) { try { RFBridge.postMessage(m); } catch (e) { } }
  if (window.RFBridge) {
    RFBridge.onmessage = function (ev) {
      var d = ev.data || '';
      if (d.indexOf('hub:data:') === 0) {
        var o = JSON.parse(d.slice(9));
        groups = o.groups || []; sites = o.sites || []; totalItems = o.items || 0;
        hitQ = o.hq || ''; hitSet = {}; (o.hits || []).forEach(function (k) { hitSet[k] = 1; });
        fillSites(); apply(true);
      } else if (d.indexOf('hub:toast:') === 0) {
        toast(d.slice(10));
      } else if (d.indexOf('hub:setq:') === 0) {
        // filmul nu mergea pe site-ul lui: il cautam dupa titlu pe toate site-urile
        $('q').value = d.slice(9); setView('all'); window.scrollTo(0, 0);
      } else if (d.indexOf('hub:status:') === 0) {
        status(JSON.parse(d.slice(11)));
      }
    };
    send('hello');
    send('hub:get');
  } else {
    $('status').textContent = 'Deschide lista din aplicația DramaFren.';
  }
  window.addEventListener('pagehide', function () { lsSet('df.lastVisit', String(visitStart)); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) lsSet('df.lastVisit', String(visitStart)); });

  var lastStatus = {};
  function status(s) {
    lastStatus = s;
    crawling = !!s.crawling;
    $('crawl').textContent = crawling ? '⏹ Oprește' : '🔄 Caută filme';
    $('crawl').className = crawling ? 'on' : 'go';
    var t = groups.length + ' filme (' + totalItems + ' din toate site-urile)';
    if (crawling) t = '⏳ ' + s.host + ' · pagina ' + s.done + ' (încă ' + s.left + ') · +' + s.added + ' noi · ' + t;
    else if (s.text) t = s.text + ' · ' + t;
    if (s.searching && s.deep) t = '🔎 căutare adâncă: „' + s.sq + '” · ' + s.sdone + '/' + s.stotal + ' · +' + s.sfound + ' filme noi (atinge aici ca s-o oprești) · ' + t;
    else if (s.searching) t = '🔎 caut „' + s.sq + '” pe site-uri: ' + s.sdone + '/' + s.stotal + ' · +' + s.sfound + ' filme noi · ' + t;
    if (s.hashing > 0) t += ' · compar postere: ' + s.hashing;
    if (s.verifying) t = '✅ verific site-urile: ' + Math.min(s.vdone + 1, s.vtotal) + '/' + s.vtotal + (s.vhost ? ' (' + s.vhost + ')' : '') + ' · atinge aici ca s-o oprești · ' + t;
    $('status').textContent = t;
  }

  function fillSites() {
    var sel = $('site'), cur = sel.value;
    sel.innerHTML = '<option value="">Toate site-urile</option>' + sites.filter(function (s) { return s.on; }).map(function (s) {
      return '<option value="' + s.host + '">' + s.host.replace('.dramafren.org', '') + ' (' + s.n + ')</option>';
    }).join('');
    sel.value = cur;
  }

  function titleScore(g, words) {
    var tt = norm(g.ti), n = 0;
    for (var i = 0; i < words.length; i++) if (wordIn(tt, words[i])) n++;
    return n;
  }
  function norm(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var hitQ = '', hitSet = {};
  function isHit(g) { for (var i = 0; i < g.ks.length; i++) if (hitSet[g.ks[i]]) return true; return false; }
  // un cuvant se potriveste si cu mici greseli de scriere (ex. "succesor" ~ "successor")
  function wordIn(tt, w) {
    if (tt.indexOf(w) >= 0) return true;
    if (w.length < 5) return false;
    return tt.indexOf(w.slice(0, Math.max(4, w.length - 2))) >= 0;
  }
  function apply(keepScroll) {
    var q = norm($('q').value.trim()), min = +$('minep').value || 0, site = $('site').value, sort = $('sort').value;
    var words = q ? q.split(/\s+/) : [];
    var gf = genreFilter();
    filtered = groups.filter(function (g) {
      var w = marked(watch, g), s = marked(seen, g);
      if (view === 'watch') { if (!w || s) return false; }
      else if (view === 'seen') { if (!s) return false; }
      else if (s) return false;
      if (min && g.ep < min) return false;
      if (site && g.ho !== site && !(g.al || []).some(function (a) { return a[1] === site; })) return false;
      // cautarea: raman doar filmele al caror titlu contine toate cuvintele scrise
      if (words.length) {
        var tt = norm(g.ti);
        for (var i = 0; i < words.length; i++) if (tt.indexOf(words[i]) < 0) return false;
      }
      if (gf && !gf(g)) return false;
      return true;
    });
    var cmp = sort === 'ep' ? function (a, b) { return b.ep - a.ep || b.t - a.t; }
      : sort === 'new' ? function (a, b) { return b.t - a.t; }
      : function (a, b) { return a.ti.localeCompare(b.ti); };
    // la o cautare: intai filmele care se potrivesc cu titlul, apoi celelalte rezultate de pe site-uri
    filtered.sort(function (a, b) {
      if (words.length) {
        var sa = titleScore(a, words), sb = titleScore(b, words);
        if (sa !== sb) return sb - sa;
      }
      return cmp(a, b);
    });
    var keep = keepScroll ? Math.max(shown, PAGE) : PAGE;
    $('grid').innerHTML = '';
    shown = 0;
    render(keep);
    var e = $('empty');
    if (!groups.length) {
      e.innerHTML = 'Lista e goală.<br>Apasă <b>🔄 Caută filme</b>: aplicația trece singură prin idrama și toate site-urile legate și adună filmele aici.<br><br>Dacă un site cere verificare (Cloudflare), deschide-l o dată din <b>🌐 Site-uri</b>, apoi caută din nou.';
      e.style.display = '';
    } else if (!filtered.length) {
      e.textContent = view === 'watch' ? 'Nu ai niciun film la „De văzut”. Apasă 📌 pe un film.' : view === 'seen' ? 'Niciun film văzut încă.' : 'Niciun film nu se potrivește.';
      e.style.display = '';
    } else e.style.display = 'none';
    status(lastStatus);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function render(upto) {
    var html = '';
    var end = Math.min(filtered.length, upto);
    for (var i = shown; i < end; i++) {
      var g = filtered[i];
      var isNew = lastVisit && g.t > lastVisit;
      html += '<div class="c" data-i="' + i + '"><div class="pw">'
        + '<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(g.im) + '" data-k="' + esc(g.k) + '">'
        + '<span class="mk"><button data-a="w" class="' + (marked(watch, g) ? 'on' : '') + '" aria-label="De văzut">📌</button>'
        + '<button data-a="s" class="' + (marked(seen, g) ? 'on' : '') + '" aria-label="Văzut">👁</button></span></div>'
        + (g.ep ? '<span class="ep">' + g.ep + ' EP</span>' : '')
        + (isNew ? '<span class="nw">NOU</span>' : '')
        + (g.bd ? '<span class="nw" style="background:#a33;top:26px">⚠ indisponibil</span>' : '')
        + '<div class="t">' + esc(g.ti) + '</div>'
        + '<div class="m"><span>' + esc(g.ho.replace('.dramafren.org', '')) + (g.al ? ' <b class="al">+' + g.al.length + '</b>' : '') + '</span></div>'
        + '</div>';
    }
    $('grid').insertAdjacentHTML('beforeend', html);
    shown = end;
    $('more').style.display = shown < filtered.length ? '' : 'none';
    $('more').textContent = 'Arată mai multe (' + (filtered.length - shown) + ')';
  }
  // posterele care nu se incarca direct trec prin aplicatie (cu adresa site-ului ca referinta)
  document.addEventListener('error', function (e) {
    var im = e.target;
    if (im.tagName !== 'IMG' || im.__retry) return;
    im.__retry = 1;
    im.src = '/img?u=' + encodeURIComponent(im.getAttribute('src')) + '&k=' + encodeURIComponent(im.getAttribute('data-k') || '');
  }, true);

  $('grid').addEventListener('click', function (e) {
    var c = e.target.closest('.c');
    if (!c) return;
    var g = filtered[+c.getAttribute('data-i')];
    var btn = e.target.closest('[data-a]');
    var a = btn && btn.getAttribute('data-a');
    if (a === 'w' || a === 's') {
      toggleMark(a === 'w' ? watch : seen, a === 'w' ? 'df.watch' : 'df.seen', g);
      btn.className = marked(a === 'w' ? watch : seen, g) ? 'on' : '';
      if (view !== 'all' || a === 's') setTimeout(function () { apply(true); }, 250);
      return;
    }
    if (e.target.classList.contains('al')) return showAlts(g);
    send('hub:open:' + g.k);
  });

  function showAlts(g) {
    var list = [[g.k, g.ho, g.ep, g.ti]].concat(g.al || []);
    sheet('<h3>' + esc(g.ti) + '</h3>' + list.map(function (a) {
      return '<div class="li"><div class="x">' + esc(a[3]) + '<small>' + esc(a[1]) + ' · ' + (a[2] || '?') + ' EP</small></div><button data-open="' + esc(a[0]) + '">Deschide</button></div>';
    }).join(''));
  }
  function sheet(html) { $('sheetBody').innerHTML = html; $('sheet').className = 'sheet show'; }
  $('sheet').addEventListener('click', function (e) {
    if (e.target === $('sheet')) { $('sheet').className = 'sheet'; return; }
    var o = e.target.getAttribute('data-open');
    if (o) { $('sheet').className = 'sheet'; send('hub:open:' + o); return; }
    var s = e.target.getAttribute('data-site');
    if (s && /^del:/.test(s) && !confirm('Ștergi ' + s.slice(4) + ' din listă, cu filmele lui?')) return;
    if (s) { send('hub:site:' + s); if (/^open:/.test(s)) $('sheet').className = 'sheet'; else setTimeout(showSites, 300); return; }
    var c = e.target.getAttribute('data-cmd');
    if (c) { $('sheet').className = 'sheet'; c === 'add' ? addSite() : c === 'clear' ? (confirm('Ștergi toate filmele din listă? Filmele de la De văzut și Văzute rămân.') && send('hub:clear:' + JSON.stringify(Object.keys(watch).concat(Object.keys(seen))))) : send('hub:' + c); }
  });

  function showSites() {
    var ncf = sites.filter(function (s) { return s.on && s.st === 'cf'; }).length;
    var stTxt = { ok: '<span class="st-ok">merge</span>', cf: '<span class="st-cf">cere verificare: deschide-l o dată</span>', gol: '<span class="st-gol">niciun film găsit</span>' };
    sheet('<h3>Site-uri (' + sites.length + ')</h3>'
      + '<p style="color:#9a9aa8;margin:0 0 6px">Site-urile noi din meniuri se adaugă singure. Cele oprite nu apar în listă și nu sunt căutate.</p>'
      + '<div class="li"><div class="x">✅ Verifică toate site-urile<small>' + (ncf ? ncf + ' cer verificare acum. ' : '') + 'Le deschid pe rând și trec singur la următorul. Tu doar bifezi căsuța când apare.</small></div><button data-cmd="verify" class="go">Pornește</button></div>'
      + sites.map(function (s) {
        var st = /^mutat:/.test(s.st || '') ? '<span class="st-ok">se mută pe ' + esc(s.st.slice(6)) + ' (filmele sunt acolo)</span>' : (stTxt[s.st] || 'necăutat încă');
        return '<div class="li"><div class="x">' + esc(s.host) + '<small>' + s.n + ' filme · ' + st + '</small></div>'
          + '<button data-site="open:' + esc(s.host) + '">Deschide</button>'
          + '<button data-site="' + (s.on ? 'off' : 'on') + ':' + esc(s.host) + '" class="' + (s.on ? 'on' : '') + '">' + (s.on ? 'Pornit' : 'Oprit') + '</button>'
          + '<button data-site="del:' + esc(s.host) + '" aria-label="Șterge site-ul">🗑</button></div>';
      }).join('')
      + '<div class="row" style="margin-top:10px"><button data-cmd="add">➕ Adaugă site</button></div>');
  }
  function addSite() {
    var u = prompt('Adresa site-ului (ex. https://exemplu.dramafren.org):');
    if (u) send('hub:addsite:' + u.trim());
  }

  $('crawl').onclick = function () { send(crawling ? 'hub:stop' : 'hub:crawl'); };
  $('status').onclick = function () {
    if (lastStatus.verifying) { if (confirm('Oprești verificarea site-urilor?')) send('hub:verifystop'); return; }
    if (lastStatus.searching && confirm('Oprești căutarea pe site-uri? Filmele găsite până acum rămân.')) send('hub:searchstop');
  };
  $('sitesBtn').onclick = showSites;
  $('menuBtn').onclick = function () {
    sheet('<h3>Meniu</h3>'
      + '<div class="li"><div class="x">Deschide idrama.dramafren.org</div><button data-site="open:idrama.dramafren.org">Deschide</button></div>'
      + '<div class="li"><div class="x">🔎 Căutare adâncă<small>Caută pe toate site-urile cu peste 100 de cuvinte des întâlnite în titluri (romantice/scene de iubire: passion, desire, seduce, affair… plus CEO, love, wife, revenge…) și adaugă tot ce găsește. Bun pentru site-urile care au doar căutare (ex. idrama). Durează mult; merge în fundal.</small></div><button data-cmd="deep">Pornește</button></div>'
      + '<div class="li"><div class="x">💋 Căutare adâncă: doar romantice<small>Doar cuvintele din titlurile cu scene de iubire (passion, desire, seduce, steamy, forbidden, one night, lover, mistress…). Mai rapidă decât cea completă.</small></div><button data-cmd="deepromance">Pornește</button></div>'
      + '<div class="li"><div class="x">Diagnostic (copiază, pentru chat)</div><button data-cmd="diag">Copiază</button></div>'
      + '<div class="li"><div class="x">Golește lista de filme</div><button data-cmd="clear">Golește</button></div>');
  };
  // ---------- cautare dupa gen (cuvinte din titlu) ----------
  // k: cuvinte/expresii despartite prin virgula; cele cu * la final se potrivesc si ca inceput de cuvant (seduc* = seduce, seduction…)
  var GENRES = [
    { n: 'Scene explicite 18+', e: '🔥', d: 'passion, desire, seduce, one night, mistress, affair, lust…',
      k: 'passion*, desire*, seduc*, steamy, lust*, one night, night with, in bed, bed, mistress*, affair*, forbidden, sinful, sin, temptation, tempt*, intimate, erotic*, sex, sexy, naughty, hot, obsess*, possess*, crav*, addicted, sugar daddy, pleasure*, dirty, spicy, taboo, lover*, lingerie, hookup, indulg*, ravish*, scandal*, heat' },
    { n: 'CEO / miliardar', e: '💼', d: 'CEO, billionaire, boss, tycoon, heir…', k: 'ceo, billionaire*, millionaire*, trillionaire*, boss*, tycoon*, president, heir, heiress, rich*, mogul, magnate, chairman, wealth*, young master' },
    { n: 'Răzbunare', e: '🗡', d: 'revenge, betrayal, regret, payback…', k: 'reveng*, betray*, vengean*, payback, regret*, karma, scorn*, cheat*, aveng*, retribution, ruthless, too late' },
    { n: 'Căsătorie / contract', e: '💍', d: 'contract, marriage, wife, bride, divorce…', k: 'contract*, marri*, marry, wife, wives, husband*, bride*, wedding*, groom, spouse*, divorc*' },
    { n: 'Romantic', e: '💕', d: 'love, heart, crush, sweet, kiss…', k: 'love*, romance, romantic, heart*, crush*, darling, sweet*, kiss*, fall for, falling, boyfriend, girlfriend' },
    { n: 'Copii / sarcină', e: '👶', d: 'pregnant, baby, twins, mommy, daddy…', k: 'pregnan*, baby, babies, twin*, triplet*, quadruplet*, quintuplet*, mommy, mom, daddy, dad, kid*, child*' },
    { n: 'Vârcolaci (alpha)', e: '🐺', d: 'alpha, wolf, luna, lycan, mate…', k: 'alpha*, wolf, wolves, werewolf*, luna, lycan*, pack, mate, mated, omega' },
    { n: 'Fantasy / vampiri', e: '🧛', d: 'vampire, dragon, witch, demon, goddess…', k: 'vampir*, dragon*, witch*, demon*, immortal*, god, goddess*, magic*, fairy, fae, angel*, devil*, monster*, curse*, mermaid*' },
    { n: 'Renaștere / a doua șansă', e: '🔁', d: 'reborn, rebirth, second chance, time travel…', k: 'reborn, rebirth, second chance, again, back to, time travel*, transmigrat*, reincarnat*, return*, redo, second life, start over' },
    { n: 'Regal / istoric', e: '👑', d: 'queen, king, prince, empress, palace…', k: 'queen*, king*, prince*, princess*, empress*, emperor*, royal*, palace*, duke*, duchess*, concubine*, throne*, dynasty, kingdom*' },
    { n: 'Identitate ascunsă', e: '🎭', d: 'hidden, secret, disguise, true identity…', k: 'hidden, secret*, disguis*, undercover, true identity, real identity, mysterious, incognito, unknown, fake, pretend*, masked, double life' },
    { n: 'Acțiune / luptă', e: '🥊', d: 'martial, war god, warrior, legend, master…', k: 'martial, war god, god of war, warrior*, fight*, legend*, invincible, master, assassin*, soldier*, mercenar*, kung fu, battle*, dragon king' },
    { n: 'Mafia / pericol', e: '🖤', d: 'mafia, don, gangster, bad boy, dangerous…', k: 'mafia*, don, gangster*, mob, bad boy, dangerous, cartel*, godfather' },
    { n: 'Școală / campus', e: '🎓', d: 'school, campus, college, student…', k: 'school*, campus, college, student*, teacher*, academy, university, professor*' },
    { n: 'Doctor / spital', e: '🩺', d: 'doctor, surgeon, nurse, hospital…', k: 'doctor*, surgeon*, nurse*, hospital*, medical' }
  ];
  GENRES.forEach(function (G) {
    var src = G.k.split(',').map(function (w) { return w.trim(); }).filter(Boolean).map(function (w) {
      var pre = /\*$/.test(w);
      w = w.replace(/\*$/, '').replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/ +/g, '\\s+');
      return w + (pre ? '' : '(?![a-z0-9])');
    }).join('|');
    G.re = new RegExp('(^|[^a-z0-9])(' + src + ')');
  });
  function findGenre(v) {
    var x = norm(v.trim()).replace(/^[^a-z0-9]+/, '');
    if (!x) return null;
    for (var i = 0; i < GENRES.length; i++) if (norm(GENRES[i].n) === x || norm(GENRES[i].e + ' ' + GENRES[i].n) === norm(v.trim())) return GENRES[i];
    // o parte din numele genului (ex. "ceo", "18+", "razbunare") alege tot genul
    if (x.length >= 3) for (var j = 0; j < GENRES.length; j++) if (norm(GENRES[j].n).indexOf(x) >= 0) return GENRES[j];
    return null;
  }
  function genreFilter() {
    var v = $('gen').value.trim();
    if (!v) return null;
    var G = findGenre(v);
    if (G) return function (g) { return G.re.test(norm(g.ti)); };
    // gen scris de mana: titlul trebuie sa contina cuvintele
    var ws = norm(v).split(/\s+/).filter(Boolean);
    return function (g) { var t = norm(g.ti); for (var i = 0; i < ws.length; i++) if (t.indexOf(ws[i]) < 0) return false; return true; };
  }
  function countGenre(G) {
    var n = 0;
    for (var i = 0; i < groups.length; i++) if (G.re.test(norm(groups[i].ti))) n++;
    return n;
  }
  function showGenres() {
    var v = norm($('gen').value.trim());
    var list = GENRES.filter(function (G) { return !v || norm(G.n + ' ' + G.d).indexOf(v) >= 0 || findGenre($('gen').value); });
    $('genList').innerHTML = '<div class="gh">Genuri căutate după cuvintele din titlu. Poți scrie și altceva (ex. „mafia”, „twins”).</div>'
      + list.map(function (G) {
        return '<button class="gi" data-g="' + esc(G.n) + '">' + G.e + ' ' + esc(G.n) + ' <span style="color:var(--mut)">(' + countGenre(G) + ')</span><small>' + esc(G.d) + '</small></button>';
      }).join('');
    $('genList').className = 'gl show';
  }
  function hideGenres() { $('genList').className = 'gl'; }
  function genChanged() {
    $('genX').style.display = $('gen').value ? '' : 'none';
    apply(false);
  }
  $('gen').addEventListener('focus', showGenres);
  $('gen').addEventListener('input', function () { showGenres(); clearTimeout(tmr); tmr = setTimeout(genChanged, 200); });
  $('gen').addEventListener('keydown', function (e) { if (e.key === 'Enter') { hideGenres(); try { $('gen').blur(); } catch (x) { } } });
  // pointerdown + preventDefault: lista nu dispare inainte sa prinda atingerea
  $('genList').addEventListener('pointerdown', function (e) { e.preventDefault(); });
  $('genList').addEventListener('click', function (e) {
    var b = e.target.closest('[data-g]');
    if (!b) return;
    var G = findGenre(b.getAttribute('data-g'));
    $('gen').value = G.e + ' ' + G.n;
    hideGenres();
    try { $('gen').blur(); } catch (x) { }
    genChanged();
    window.scrollTo(0, 0);
    if (G.e === '🔥') toast('Pentru mai multe filme de genul ăsta: ⋯ → Căutare adâncă: doar romantice.');
  });
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('#genList') && e.target !== $('gen')) hideGenres();
  });
  $('genX').onclick = function () { $('gen').value = ''; hideGenres(); genChanged(); };

  var tmr;
  // cautarea merge si pe toate site-urile (filmele gasite acolo se adauga in lista)
  // campul de cautare filtreaza DOAR lista incarcata; pe site-uri se cauta numai cand apesi butonul
  function siteSearch() {
    var q = $('q').value.trim();
    if (q.length < 3) { toast('Scrie cel puțin 3 litere, apoi apasă „Caută pe site-uri”.'); try { $('q').focus(); } catch (x) { } return; }
    send('hub:search:' + q);
    toast('Caut „' + q + '” pe toate site-urile. Filmele găsite se adaugă în listă.');
  }
  $('siteSearch').onclick = siteSearch;
  $('q').addEventListener('input', function () {
    clearTimeout(tmr); tmr = setTimeout(function () { apply(false); }, 150);
  });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { try { $('q').blur(); } catch (x) { } } });
  $('minep').addEventListener('input', function () { clearTimeout(tmr); tmr = setTimeout(function () { apply(false); }, 250); });
  $('sort').onchange = $('site').onchange = function () { apply(false); };
  $('more').onclick = function () { render(shown + PAGE); };
  window.addEventListener('scroll', function () {
    if (shown < filtered.length && window.innerHeight + window.scrollY > document.body.scrollHeight - 800) render(shown + PAGE);
  });
  function setView(v) {
    view = v;
    $('vAll').className = v === 'all' ? 'on' : '';
    $('vWatch').className = v === 'watch' ? 'on' : '';
    $('vSeen').className = v === 'seen' ? 'on' : '';
    apply(false);
  }
  $('vAll').onclick = function () { setView('all'); };
  $('vWatch').onclick = function () { setView('watch'); };
  $('vSeen').onclick = function () { setView('seen'); };
})();
</script>
</body>
</html>
