plugins {
    id 'com.android.application'
}

android {
    namespace 'net.reelfren.app'
    compileSdk 34

    defaultConfig {
        applicationId 'net.reelfren.app'
        minSdk 26
        targetSdk 34
        versionCode 63
        versionName '7.1'
    }

    buildFeatures {
        buildConfig true
    }

    // Aceeasi aplicatie pentru mai multe site-uri. Fiecare varianta are id-ul ei
    // (se instaleaza in paralel), numele, iconita si site-ul ei.
    flavorDimensions 'site'
    productFlavors {
        reelfren {
            dimension 'site'
            applicationId 'net.reelfren.app'
            buildConfigField 'String', 'HOME_URL', '"https://reelfren.net/explore"'
            buildConfigField 'String', 'ALLOWED_DOMAINS', '"reelfren.net"'
            buildConfigField 'boolean', 'HUB', 'false'
        }
        shortmax {
            dimension 'site'
            applicationId 'live.shorttw.shortmax.app'
            buildConfigField 'String', 'HOME_URL', '"https://shortmax.shorttw.live/index.php"'
            buildConfigField 'String', 'ALLOWED_DOMAINS', '"shorttw.live"'
            buildConfigField 'boolean', 'HUB', 'false'
        }
        // DramaFren: o singura lista cu filmele de pe idrama.dramafren.org si toate site-urile legate
        dramafren {
            dimension 'site'
            applicationId 'org.dramafren.app'
            buildConfigField 'String', 'HOME_URL', '"https://idrama.dramafren.org/"'
            buildConfigField 'String', 'ALLOWED_DOMAINS', '"dramafren.org"'
            buildConfigField 'boolean', 'HUB', 'true'
        }
    }

    signingConfigs {
        // Cheia vine din variabile de mediu (GitHub Secrets in CI), nu din repo.
        personal {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'reelfren'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
