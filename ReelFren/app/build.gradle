plugins {
    id 'com.android.application'
}

android {
    namespace 'net.reelfren.app'
    compileSdk 34

    defaultConfig {
        applicationId 'net.reelfren.app'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '2.2'
    }

    signingConfigs {
        // Cheia vine din variabile de mediu (GitHub Secrets in CI), nu din repo.
        personal {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'reelfren'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
